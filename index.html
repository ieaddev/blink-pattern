<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink Pattern Explorer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        h1 {
            color: #e94560;
            margin-bottom: 30px;
        }
        
        .controls {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-size: 14px;
            color: #a0a0b0;
        }
        
        select, button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background: #0f3460;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        
        select:focus, button:focus {
            outline: none;
            box-shadow: 0 0 5px #e94560;
        }
        
        button {
            background: #e94560;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #c81e45;
        }
        
        .visualizer {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }
        
        .circle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid #0f3460;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .color-circle {
            background: linear-gradient(to right, #ff0000, #ff00ff, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);
        }
        
        .intensity-circle {
            background: radial-gradient(circle, #ffffff 0%, #000000 100%);
        }
        
        .circle-inner {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
        }
        
        .info {
            background: #16213e;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            max-width: 600px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        
        .info-label {
            color: #a0a0b0;
        }
        
        .info-value {
            color: #4ff08c;
        }
    </style>
</head>
<body>
    <h1>Blink Pattern Explorer</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="pattern">Blink Pattern:</label>
            <select id="pattern">
                <option value="rgbSweep">RGB Color Sweep</option>
                <option value="candle">Candle Flicker</option>
                <option value="perlinCandle">Perlin Candle</option>
            </select>
        </div>
        <div class="control-group">
            <label for="speed">Speed:</label>
            <select id="speed">
                <option value="1">1x</option>
                <option value="2">2x</option>
                <option value="4">4x</option>
                <option value="0.5">0.5x</option>
                <option value="0.25">0.25x</option>
            </select>
        </div>
        <div class="control-group">
            <label>&nbsp;</label>
            <button id="reset">Reset PRNG</button>
        </div>
    </div>
    
    <div class="visualizer">
        <div class="circle-container">
            <span>Color</span>
            <div class="circle color-circle">
                <div class="circle-inner" id="colorDisplay"></div>
            </div>
        </div>
        <div class="circle-container">
            <span>Intensity</span>
            <div class="circle intensity-circle">
                <div class="circle-inner" id="intensityDisplay"></div>
            </div>
        </div>
    </div>
    
    <div class="info">
        <div class="info-row">
            <span class="info-label">Pattern:</span>
            <span class="info-value" id="infoPattern">RGB Color Sweep</span>
        </div>
        <div class="info-row">
            <span class="info-label">Timer (60Hz):</span>
            <span class="info-value" id="infoTimer">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">PRNG State:</span>
            <span class="info-value" id="infoPrng">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">RGB:</span>
            <span class="info-value" id="infoRgb">(0, 0, 0)</span>
        </div>
        <div class="info-row">
            <span class="info-label">Intensity:</span>
            <span class="info-value" id="infoIntensity">0%</span>
        </div>
        <div class="info-row">
            <span class="info-label">HSV:</span>
            <span class="info-value" id="infoHsv">(0°, 0%, 0%)</span>
        </div>
    </div>

    <script>
        // LCG PRNG implementation
        class LCG {
            constructor(seed = 42) {
                this.state = seed;
                // Using parameters from MMIX by Donald Knuth
                this.a = 6364136223846793005;
                this.c = 1442695040888963407;
                this.m = Math.pow(2, 64);
            }
            
            next() {
                this.state = (this.a * this.state + this.c) % this.m;
                return this.state / this.m; // Normalized to [0, 1)
            }
            
            nextInt(max) {
                return Math.floor(this.next() * max);
            }
            
            reset(seed = 42) {
                this.state = seed;
            }
        }
        
        // Perlin Noise implementation for natural candle flicker
        class PerlinNoise {
            constructor(seed = 0) {
                this.seed = seed;
                this.p = this.buildPermutationTable(seed);
            }
            
            buildPermutationTable(seed) {
                const p = [];
                const random = new LCG(seed);
                
                for (let i = 0; i < 256; i++) {
                    p[i] = i;
                }
                
                // Fisher-Yates shuffle
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(random.next() * (i + 1));
                    [p[i], p[j]] = [p[j], p[i]];
                }
                
                return [...p, ...p];
            }
            
            fade(t) {
                return t * t * t * (t * (t * 6 - 15) + 10);
            }
            
            lerp(t, a, b) {
                return a + t * (b - a);
            }
            
            grad(hash, x, y) {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 4 ? y : (h === 12 || h === 14 ? x : 0);
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }
            
            noise2(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                
                x -= Math.floor(x);
                y -= Math.floor(y);
                
                const u = this.fade(x);
                const v = this.fade(y);
                
                const A = this.p[X] + Y;
                const AA = this.p[A];
                const AB = this.p[A + 1];
                const B = this.p[X + 1] + Y;
                const BA = this.p[B];
                const BB = this.p[B + 1];
                
                return this.lerp(
                    v,
                    this.lerp(u, this.grad(this.p[AA], x, y), this.grad(this.p[BA], x - 1, y)),
                    this.lerp(u, this.grad(this.p[AB], x, y - 1), this.grad(this.p[BB], x - 1, y - 1))
                );
            }
            
            fBm(x, y, octaves = 4, persistence = 0.5, lacunarity = 2.0) {
                let total = 0;
                let frequency = 1;
                let amplitude = 1;
                let maxValue = 0;
                
                for (let i = 0; i < octaves; i++) {
                    total += this.noise2(x * frequency, y * frequency) * amplitude;
                    maxValue += amplitude;
                    amplitude *= persistence;
                    frequency *= lacunarity;
                }
                
                return total / maxValue;
            }
        }
        
        // Timer at 60Hz
        class Timer {
            constructor(fps = 60) {
                this.fps = fps;
                this.interval = 1000 / fps;
                this.frame = 0;
                this.lastTime = 0;
                this.callback = null;
            }
            
            start(callback) {
                this.callback = callback;
                this.frame = 0;
                this.lastTime = performance.now();
                this.run();
            }
            
            run() {
                const now = performance.now();
                const elapsed = now - this.lastTime;
                
                if (elapsed >= this.interval) {
                    this.callback(this.frame);
                    this.frame++;
                    this.lastTime = now - (elapsed % this.interval);
                }
                
                requestAnimationFrame(() => this.run());
            }
        }
        
        // Blink patterns
        const patterns = {
            rgbSweep: {
                name: 'RGB Color Sweep',
                // Goes around color circle with constant intensity, ignoring white LED
                execute: function(timerFrame, prng, speed) {
                    // Advance PRNG to keep state moving
                    prng.next();
                    
                    // Hue cycles from 0 to 360 degrees over time
                    const hue = (timerFrame * speed * 0.5) % 360;
                    const saturation = 100;
                    const value = 100;
                    
                    // Convert HSV to RGB
                    const rgb = hsvToRgb(hue / 360, saturation / 100, value / 100);
                    
                    return {
                        r: rgb.r,
                        g: rgb.g,
                        b: rgb.b,
                        w: 0, // White LED is ignored
                        intensity: value / 100
                    };
                }
            },
            candle: {
                name: 'Candle Flicker',
                // Perlin noise based candle simulation with natural flickering
                execute: function(timerFrame, prng, speed) {
                    // Create Perlin noise instance with PRNG seed for reproducibility
                    const perlin = new PerlinNoise(prng.state);
                    
                    // Use time-based x coordinate for smooth animation
                    const time = timerFrame * speed * 0.01;
                    
                    // Generate noise values for different aspects
                    // fBm for smooth, natural-looking flicker
                    const flickerNoise = perlin.fBm(time, 0, 4, 0.5, 2.0);
                    
                    // Map noise range [-1,1] to intensity range [0.6, 1.0]
                    const baseIntensity = 0.8 + flickerNoise * 0.2;
                    
                    // Add subtle hue variation using different noise octaves
                    const hueNoise = perlin.fBm(time * 0.3, 100, 2, 0.7, 1.5);
                    const hueVariation = (hueNoise * 0.5 + 0.5) * 15; // 0 to 15 degrees
                    const hue = (25 + hueVariation) % 360;
                    
                    // Saturation with slight variation
                    const satNoise = perlin.fBm(time * 0.5, 200, 3, 0.6, 1.8);
                    const saturation = 70 + (satNoise * 0.5 + 0.5) * 30; // 70-100%
                    
                    // Convert HSV to RGB
                    const rgb = hsvToRgb(hue / 360, saturation / 100, baseIntensity);
                    
                    return {
                        r: rgb.r,
                        g: rgb.g,
                        b: rgb.b,
                        w: 0, // White LED is ignored
                        intensity: baseIntensity
                    };
                }
            },
            perlinCandle: {
                name: 'Perlin Candle',
                // Advanced perlin noise candle with multi-layered effects
                execute: function(timerFrame, prng, speed) {
                    const perlin = new PerlinNoise(prng.state);
                    const time = timerFrame * speed * 0.01;
                    
                    // Primary flicker - fast, small variations
                    const flicker1 = perlin.fBm(time * 2, 0, 3, 0.6, 2.0);
                    
                    // Secondary flicker - slower, larger variations
                    const flicker2 = perlin.fBm(time * 0.5, 50, 4, 0.4, 2.0);
                    
                    // Combine flickers for more natural effect
                    const intensity = 0.7 + (flicker1 * 0.15 + flicker2 * 0.1) + 0.15;
                    
                    // Hue with slow drift and fast flicker
                    const hueSlow = perlin.fBm(time * 0.1, 100, 2, 0.8, 1.5);
                    const hueFast = perlin.fBm(time * 3, 200, 3, 0.5, 1.8);
                    const hue = (20 + hueSlow * 10 + hueFast * 5 + 360) % 360;
                    
                    // Saturation with subtle variation
                    const saturation = 85 + perlin.fBm(time * 0.3, 300, 2, 0.7, 1.5) * 15;
                    
                    const rgb = hsvToRgb(hue / 360, saturation / 100, Math.min(intensity, 1.0));
                    
                    return {
                        r: rgb.r,
                        g: rgb.g,
                        b: rgb.b,
                        w: 0,
                        intensity: Math.min(intensity, 1.0)
                    };
                }
            }
        };
        
        // HSV to RGB conversion
        function hsvToRgb(h, s, v) {
            let r, g, b;
            
            if (s === 0) {
                r = g = b = v;
            } else {
                const i = Math.floor(h * 6);
                const f = h * 6 - i;
                const p = v * (1 - s);
                const q = v * (1 - f * s);
                const t = v * (1 - (1 - f) * s);
                
                switch (i % 6) {
                    case 0: r = v; g = t; b = p; break;
                    case 1: r = q; g = v; b = p; break;
                    case 2: r = p; g = v; b = t; break;
                    case 3: r = p; g = q; b = v; break;
                    case 4: r = t; g = p; b = v; break;
                    case 5: r = v; g = p; b = q; break;
                }
            }
            
            return {
                r: Math.round(r * 255),
                g: Math.round(g * 255),
                b: Math.round(b * 255)
            };
        }
        
        // RGB to HSV conversion for display
        function rgbToHsv(r, g, b) {
            r = r / 255;
            g = g / 255;
            b = b / 255;
            
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            const delta = max - min;
            
            let h = 0;
            if (delta > 0) {
                if (max === r) {
                    h = 60 * (((g - b) / delta) % 6);
                } else if (max === g) {
                    h = 60 * (((b - r) / delta) + 2);
                } else {
                    h = 60 * (((r - g) / delta) + 4);
                }
            }
            
            if (h < 0) h += 360;
            
            const s = max === 0 ? 0 : delta / max;
            const v = max;
            
            return {
                h: Math.round(h),
                s: Math.round(s * 100),
                v: Math.round(v * 100)
            };
        }
        
        // Main application
        function main() {
            // Elements
            const patternSelect = document.getElementById('pattern');
            const speedSelect = document.getElementById('speed');
            const resetBtn = document.getElementById('reset');
            const colorDisplay = document.getElementById('colorDisplay');
            const intensityDisplay = document.getElementById('intensityDisplay');
            
            // Info elements
            const infoPattern = document.getElementById('infoPattern');
            const infoTimer = document.getElementById('infoTimer');
            const infoPrng = document.getElementById('infoPrng');
            const infoRgb = document.getElementById('infoRgb');
            const infoIntensity = document.getElementById('infoIntensity');
            const infoHsv = document.getElementById('infoHsv');
            
            // Initialize PRNG and Timer
            const prng = new LCG();
            const timer = new Timer(60);
            let currentPattern = 'rgbSweep';
            let speed = 1;
            
            // Update UI with current state
            function updateUI(result, frame, prngState) {
                // Update color display
                colorDisplay.style.backgroundColor = `rgb(${result.r}, ${result.g}, ${result.b})`;
                
                // Update intensity display
                const intensityPercent = result.intensity * 100;
                intensityDisplay.style.backgroundColor = `rgba(255, 255, 255, ${result.intensity})`;
                intensityDisplay.style.boxShadow = `0 0 20px rgba(255, 255, 255, ${result.intensity})`;
                
                // Update info with fixed-width formatting
                infoTimer.textContent = frame.toString().padStart(6, ' ');
                infoPrng.textContent = prngState.toString().padStart(20, '0');
                infoPattern.textContent = patterns[currentPattern].name;
                infoRgb.textContent = `(${result.r.toString().padStart(3, ' ')}, ${result.g.toString().padStart(3, ' ')}, ${result.b.toString().padStart(3, ' ')})`;
                infoIntensity.textContent = `${Math.round(intensityPercent).toString().padStart(3, ' ')}%`;
                
                const hsv = rgbToHsv(result.r, result.g, result.b);
                infoHsv.textContent = `(${hsv.h.toString().padStart(3, ' ')}\u00b0, ${hsv.s.toString().padStart(3, ' ')}%, ${hsv.v.toString().padStart(3, ' ')}%)`;
            }
            
            // Timer callback
            function onTimer(frame) {
                speed = parseFloat(speedSelect.value);
                const result = patterns[currentPattern].execute(frame, prng, speed);
                updateUI(result, frame, prng.state);
            }
            
            // Event listeners
            patternSelect.addEventListener('change', (e) => {
                currentPattern = e.target.value;
            });
            
            speedSelect.addEventListener('change', (e) => {
                speed = parseFloat(e.target.value);
            });
            
            resetBtn.addEventListener('click', () => {
                prng.reset();
            });
            
            // Start the timer
            timer.start(onTimer);
        }
        
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', main);
    </script>
</body>
</html>
