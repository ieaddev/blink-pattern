<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink Pattern Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Blink Pattern Explorer</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="pattern">Blink Pattern:</label>
            <select id="pattern" aria-label="Blink Pattern">
                <option value="rgbSweep">RGB Color Sweep</option>
                <option value="candle">Candle Flicker</option>
                <option value="perlinCandle">Perlin Candle</option>
                <option value="lfsrCandle">LFSR Candle</option>
                <option value="oscillatorCandle">Oscillator Candle</option>
                <option value="randomWalkCandle">Random Walk Candle</option>
            </select>
        </div>
        <div class="control-group">
            <label for="prng">PRNG:</label>
            <select id="prng" aria-label="PRNG Implementation">
                <option value="lcg">LCG</option>
                <option value="lfsr">LFSR</option>
            </select>
        </div>
        <div class="control-group">
            <label for="speed">Speed:</label>
            <select id="speed" aria-label="Speed">
                <option value="1">1x</option>
                <option value="2">2x</option>
                <option value="4">4x</option>
                <option value="0.5">0.5x</option>
                <option value="0.25">0.25x</option>
            </select>
        </div>
        <div class="control-group">
            <label>&nbsp;</label>
            <button id="reset" aria-label="Reset PRNG">Reset PRNG</button>
        </div>
    </div>
    
    <div class="visualizer" aria-live="polite">
        <div class="circle-container">
            <span>Color</span>
            <div class="circle color-circle">
                <div class="circle-inner" id="colorDisplay"></div>
            </div>
        </div>
        <div class="circle-container">
            <span>Intensity</span>
            <div class="circle intensity-circle">
                <div class="circle-inner" id="intensityDisplay"></div>
            </div>
        </div>
    </div>
    
    <div class="info" aria-live="polite">
        <div class="info-row">
            <span class="info-label">Pattern:</span>
            <span class="info-value" id="infoPattern">RGB Color Sweep</span>
        </div>
        <div class="info-row">
            <span class="info-label">PRNG:</span>
            <span class="info-value" id="infoPrngType">LCG</span>
        </div>
        <div class="info-row">
            <span class="info-label">Timer (60Hz):</span>
            <span class="info-value" id="infoTimer">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">PRNG State:</span>
            <span class="info-value" id="infoPrng">0</span>
        </div>
        <div class="info-row">
            <span class="info-label">RGB:</span>
            <span class="info-value" id="infoRgb">(0, 0, 0)</span>
        </div>
        <div class="info-row">
            <span class="info-label">Intensity:</span>
            <span class="info-value" id="infoIntensity">0%</span>
        </div>
        <div class="info-row">
            <span class="info-label">HSV:</span>
            <span class="info-value" id="infoHsv">(0&deg;, 0%, 0%)</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
